<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto — VÉRTICE</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/contacto.css">
</head>
<body>
  <header>
    <div class="container header-inner">
      <a href="index.html" class="logo">VÉRTICE</a>
      <nav>
        <ul>
          <li><a href="index.html">Inicio</a></li>
          <li><a href="productos.html">Productos</a></li>
          <li><a href="contacto.html" class="active">Contacto</a></li>
          <li><a href="carrito.html" class="cart-link">Carrito <span class="cart-count">0</span></a></li>
        </ul>
      </nav>
    </div>
  </header>

  <section class="section">
    <div class="container">
      <h1 class="section-title">Atención al cliente</h1>
      <div class="form-section">
        <form action="#" method="post">
          <div class="form-row">
            <div class="form-group">
              <label for="nombre">Nombre</label>
              <input type="text" id="nombre" name="nombre" placeholder="Ingresa tu nombre" required>
            </div>
            <div class="form-group">
              <label for="apellido">Apellido</label>
              <input type="text" id="apellido" name="apellido" placeholder="Ingresa tu apellido" required>
            </div>
          </div>
          <div class="form-group">
            <label for="email">Correo electrónico</label>
            <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
          </div>
          <div class="form-group">
            <label for="asunto">Asunto</label>
            <select id="asunto" name="asunto" required>
              <option value="" disabled selected>Selecciona un asunto</option>
              <option value="consulta">Consulta sobre productos</option>
              <option value="pedido">Estado de mi pedido</option>
              <option value="devolucion">Cambios y devoluciones</option>
              <option value="otro">Otro motivo</option>
            </select>
          </div>
          <div class="form-group">
            <label for="mensaje">Mensaje</label>
            <textarea id="mensaje" name="mensaje" placeholder="Escribe tu mensaje aquí..." required></textarea>
          </div>
          <button type="submit" class="btn">Enviar mensaje</button>
        </form>
      </div>
    </div>
  </section>

  <footer>
    <div class="container">
      <p>&copy; 2026 VÉRTICE. Todos los derechos reservados.</p>
    </div>
  </footer>
</body>
</html>
